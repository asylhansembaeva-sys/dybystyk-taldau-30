<!doctype html><html lang="kk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1,viewport-fit=cover"><title>ДЫБЫСТЫҚ ТАЛДАУ</title><style>
:root{font-family:'Times New Roman',serif;color:#192447}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 10% 10%,#fff3aa 0,transparent 28%),radial-gradient(circle at 92% 12%,#e6c4ff 0,transparent 30%),linear-gradient(135deg,#bdeeff,#fff2cf 55%,#c9f8db);padding:12px}main{max-width:1400px;margin:auto}header{text-align:center;background:#fff9ed;border:4px solid #9b4ee8;border-radius:22px;padding:9px 14px;box-shadow:0 5px 0 #9b4ee840}h1{margin:0;color:#8c147e;font-size:clamp(24px,3.5vw,46px);font-weight:900}header p{margin:5px 0 0;color:#123c9b;font-weight:900;font-size:clamp(16px,2vw,26px)}.bar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:12px 0;flex-wrap:wrap}.pill{background:#fff;border:3px solid #326cbd;border-radius:14px;padding:7px 15px;font-size:clamp(19px,2vw,29px);font-weight:900}.wordbox{background:linear-gradient(135deg,#fbd4ee,#ffe5a4);border:6px solid #c42b92;border-radius:24px;text-align:center;padding:18px 8px 20px;box-shadow:0 7px 0 #b32c8255}.word{font-size:clamp(55px,8.5vw,124px);font-weight:900;letter-spacing:.055em;color:#0d1746;line-height:1.1;text-shadow:1px 2px #fff}.hint{text-align:center;font-weight:900;color:#7023a0;font-size:clamp(18px,2.3vw,30px);margin:13px 0 10px}.board{display:flex;justify-content:center;gap:clamp(5px,1.1vw,18px);margin:0 auto;max-width:1200px}.lettercol{flex:1;max-width:165px;min-width:0;display:flex;flex-direction:column;align-items:center;gap:8px}.letter{width:100%;text-align:center;font-size:clamp(36px,5vw,76px);font-weight:900;background:#fff;border:3px solid #4468a8;border-radius:15px;color:#0d1640;padding:2px}.slot{display:flex;align-items:center;justify-content:center;background:#fff;border:4px dashed #797aa8;border-radius:14px;cursor:pointer;touch-action:manipulation;transition:background .12s}.slot.circle{width:clamp(44px,5.8vw,82px);height:clamp(44px,5.8vw,82px);border-radius:50%}.slot.circle.red{background:#e52a43;border:4px solid #b9122b}.slot.circle.blue{background:#176ee9;border:4px solid #0d4a9b}.slot.label{width:100%;height:clamp(52px,5.6vw,75px);font-size:clamp(13px,1.75vw,25px);font-weight:900;line-height:1;color:#151d3b;overflow-wrap:anywhere;padding:2px}.slot.label.filled{border-style:solid;background:#fff3b6;border-color:#d79920}.choices{background:#fffdf5;border:4px solid #ecb53d;border-radius:22px;padding:10px 12px;margin-top:14px}.choices h2{font-size:clamp(20px,2.6vw,34px);color:#aa175f;text-align:center;margin:2px 0 10px}.tiles{display:flex;justify-content:center;gap:clamp(6px,1.2vw,16px);flex-wrap:wrap}.tile{font-family:inherit;font-weight:900;font-size:clamp(20px,2.2vw,31px);border:4px solid #33476c;border-radius:15px;min-height:clamp(54px,5.8vw,80px);padding:7px 14px;background:#ffdd74;color:#111b40;cursor:grab;touch-action:none;user-select:none;box-shadow:0 4px 0 #0002}.tile[data-type=color]{width:clamp(58px,6vw,82px);border-radius:50%;padding:0}.tile[data-val=red]{background:#e52a43}.tile[data-val=blue]{background:#176ee9}.tile.active{outline:6px solid #8b2ac6;outline-offset:2px}.actions{display:flex;justify-content:center;align-items:center;gap:12px;flex-wrap:wrap;margin:14px 0}.action{font-family:inherit;font-size:clamp(22px,2.7vw,34px);font-weight:900;background:#15a95d;color:#fff;border:4px solid #086d3d;border-radius:17px;padding:10px 26px;cursor:pointer}.action.secondary{background:#6a48d9;border-color:#44269e}.action.tertiary{background:#fff;color:#244f9c;border-color:#5784d4}.status{text-align:center;min-height:34px;font-size:clamp(19px,2.2vw,29px);font-weight:900;color:#0c7c45}.nav{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:6px;max-width:900px;margin:10px auto 20px}.nav button{font-family:inherit;font-size:clamp(17px,2vw,27px);font-weight:900;min-height:42px;border-radius:10px;border:2px solid #7e6ca5;background:white;color:#222}.nav button.current{background:#8a44da;color:white}.nav button.done{background:#24bd73;color:#fff;border-color:#09783f}.ghost{position:fixed;z-index:99;pointer-events:none;opacity:.88;transform:translate(-50%,-50%);font-family:'Times New Roman';font-weight:900;font-size:25px;padding:12px;border:3px solid #253a66;border-radius:13px;background:#ffe478}.footer{text-align:center;color:#49376d;font-weight:900;padding:5px 0 20px}@media(max-width:650px){body{padding:5px}header{border-width:3px;border-radius:14px;padding:8px}.wordbox{padding:12px 4px;border-width:4px}.board{gap:4px}.lettercol{gap:6px}.letter{border-width:2px;border-radius:8px;font-size:clamp(32px,9vw,52px)}.slot.circle{width:clamp(35px,10vw,57px);height:clamp(35px,10vw,57px);border-width:3px}.slot.label{height:62px;font-size:clamp(11px,2.8vw,17px);border-width:2px;border-radius:7px}.choices{padding:8px 5px}.tile{font-size:clamp(16px,4.2vw,23px);padding:6px 8px;min-height:54px;border-width:2px}.tile[data-type=color]{width:54px}.nav{grid-template-columns:repeat(6,minmax(0,1fr))}.pill{font-size:18px}.hint{font-size:17px}}@media(min-width:1000px){.slot.label{font-size:26px}}

/* Сөз тек бір рет көрсетіледі: жоғарғы қанық түсті төртбұрыштың ішінде.
   Әр әріптің астында бірден түс пен түр ұяшықтары орналасады. */
.wordbox{padding:18px 12px 22px;background:linear-gradient(135deg,#ffd6ed,#ffe6a4);}
.board-scroll{width:100%;overflow-x:auto;overscroll-behavior-x:contain;padding:4px 2px 12px;}
.board{width:100%;max-width:1260px;gap:clamp(6px,1vw,16px);align-items:stretch;}
.lettercol{max-width:none;gap:13px;}
.letter{font-size:clamp(55px,7vw,100px);border:0;background:transparent;color:#07143b;text-shadow:2px 2px #fff;line-height:1.13;}
.slot.circle{width:clamp(55px,6.3vw,92px);height:clamp(55px,6.3vw,92px);}
.slot.label{height:clamp(72px,7.5vw,104px);font-size:clamp(22px,2.65vw,37px);line-height:1.06;padding:6px 3px;overflow-wrap:normal;word-break:normal;hyphens:none;}
.slot.label.filled{background:#fff0a5;border:4px solid #cc8210;color:#09163c;font-weight:900;}
@media(max-width:800px){
 .wordbox{padding:12px 6px 16px;}
 .board{min-width:680px;gap:7px;}
 .letter{font-size:66px;}
 .slot.circle{width:65px;height:65px;}
 .slot.label{height:82px;font-size:25px;}
 .hint{font-size:clamp(17px,4vw,23px);}
}

/* Сөз түрлі түсті төртбұрышта, талдау ұяшықтары оның АСТЫНДА */
.wordbox{padding:18px 12px 20px;margin-bottom:12px}
.word{font-size:clamp(58px,8.2vw,116px);line-height:1.1}
.analysis-below{background:#fffdf7;border:4px solid #6b51c8;border-radius:20px;padding:16px 10px 18px;box-shadow:0 5px 0 #6b51c833}
.analysis-below .board{margin:0 auto}
.analysis-below .letter{background:#fff4bd;border:3px solid #5c69b2;border-radius:13px;padding:5px 2px}
@media(max-width:800px){.analysis-below{padding:10px 5px 14px}.wordbox{margin-bottom:9px}}

/* Бір ғана сөз: жоғарыдағы төртбұрышта. Дәл астындағы әр баған сөздің әрпіне сәйкес. */
.analysis-scroll{width:100%;overflow-x:auto;overscroll-behavior-x:contain;padding:4px 2px 12px}
.analysis-scroll .wordbox,.analysis-scroll .analysis-below{min-width:680px;max-width:1260px;margin-left:auto;margin-right:auto}
.analysis-scroll .wordbox{padding:16px 12px 18px;margin-bottom:0;border-bottom-left-radius:0;border-bottom-right-radius:0}
.analysis-scroll .word{display:grid;grid-template-columns:repeat(var(--letters),minmax(0,1fr));gap:7px;align-items:center;font-size:clamp(52px,7.4vw,102px);letter-spacing:0;line-height:1.15}
.analysis-scroll .word span{min-width:0;text-align:center}
.analysis-scroll .analysis-below{background:transparent;border:0;box-shadow:none;padding:14px 12px 8px}
.analysis-scroll .board{display:grid;grid-template-columns:repeat(var(--letters),minmax(0,1fr));gap:7px;max-width:none;width:100%;min-width:0}
.analysis-scroll .lettercol{width:100%;max-width:none;min-width:0;gap:13px}
.analysis-scroll .slot.circle{flex-shrink:0}
@media(min-width:801px){.analysis-scroll .wordbox,.analysis-scroll .analysis-below{min-width:0}}
@media(max-width:800px){.analysis-scroll .word{font-size:76px}.analysis-scroll .wordbox,.analysis-scroll .analysis-below{width:680px}.analysis-scroll .slot.label{font-size:25px}}

/* Таңдау атауының алдындағы ұсақ түсті дөңгелектер алынды.
   Орналастырылған дыбыс түрлері тақтада алыстан оқылатындай үлкейтілді. */
.analysis-scroll .slot.label{font-size:clamp(28px,3vw,43px);font-weight:900;line-height:1.04;min-height:100px;letter-spacing:-.025em;padding:5px 1px;}
.analysis-scroll .slot.label.filled{font-size:clamp(28px,3vw,43px);color:#071338;}
@media(max-width:800px){.analysis-scroll .slot.label,.analysis-scroll .slot.label.filled{font-size:32px;min-height:100px;}}

/* Телефонда сөз және барлық әріп ұяшықтары экран еніне толық сыйсын. */
@media(max-width:800px){
 .analysis-scroll{overflow-x:hidden;padding-left:0;padding-right:0}
 .analysis-scroll .wordbox,.analysis-scroll .analysis-below{min-width:0;width:100%;max-width:100%}
 .analysis-scroll .word{font-size:clamp(28px,8.2vw,52px);gap:2px;line-height:1.25}
 .analysis-scroll .board{gap:2px}
 .analysis-scroll .lettercol{gap:7px}
 .analysis-scroll .slot.circle{width:clamp(29px,8.5vw,45px);height:clamp(29px,8.5vw,45px)}
 .analysis-scroll .slot.label,.analysis-scroll .slot.label.filled{font-size:clamp(11px,2.8vw,17px);min-height:70px;height:70px;letter-spacing:-.04em;overflow-wrap:anywhere;word-break:normal;padding:2px 0}
 .analysis-scroll .wordbox{padding:12px 4px 15px}
 .analysis-scroll .analysis-below{padding:12px 2px 8px}
}

/* Телефондағы толтырылған дыбыс түрлері анық, ірі көрінсін. */
@media(max-width:800px){
 .analysis-scroll .slot.label,
 .analysis-scroll .slot.label.filled{
   font-size:clamp(17px,4.6vw,23px);
   font-weight:900;
   letter-spacing:-.045em;
   line-height:1.05;
   overflow-wrap:normal;
   word-break:normal;
 }
 .analysis-scroll .slot.label.long-label,
 .analysis-scroll .slot.label.long-label.filled{
   font-size:clamp(15px,4vw,20px);
   letter-spacing:-.055em;
 }
 .analysis-scroll .slot.label .label-lines{display:block;text-align:center}
}
</style></head><body><main><header><h1>🌟 ДЫБЫСТЫҚ ТАЛДАУ 🌟</h1><p>Әр дыбыстың түсін және түрін анықта!</p></header><div class="bar"><div class="pill" id="progress">1 / 30</div><div class="pill">⏱️ <span id="timer">00:00</span></div><div class="pill" id="counter">Дұрыс: 0 / 30</div></div><div class="hint">ӘР ӘРІПТІҢ АСТЫНА ДЫБЫС ТҮСІ МЕН ТҮРІН ҚОЙ!</div><div class="analysis-scroll"><section class="wordbox"><div class="word" id="displayWord"></div></section><div class="analysis-below"><div class="board" id="board"></div></div></div><section class="choices"><h2>ДЫБЫС ТҮСТЕРІ МЕН ТҮРЛЕРІН ТАҢДА!</h2><div class="tiles" id="tiles"></div></section><div class="status" id="status" aria-live="polite"></div><div class="actions"><button class="action secondary" id="prev">◀ АЛДЫҢҒЫ</button><button class="action" id="next">КЕЛЕСІ ▶</button><button class="action tertiary" id="restart">↻ ҚАЙТА ОЙНАУ</button></div><div class="hint">ТАПСЫРМАНЫ ТАҢДА: 1–30</div><nav class="nav" id="nav"></nav><div class="footer">Қызыл — дауысты · Көк — дауыссыз</div></main><script>
const WORDS=["қалам", "терек", "балық", "күрек", "сандық", "көмек", "қасық", "есік", "дорба", "күміс", "орман", "өрік", "тарақ", "бесік", "құдық", "көбік", "бұлақ", "жүзім", "табан", "тілек", "қармақ", "желек", "мақал", "көлік", "құрақ", "зерек", "балға", "кесте", "қорған", "мектеп"];
const VOWELS={а:'жуан',ә:'жіңішке',о:'жуан',ө:'жіңішке',ұ:'жуан',ү:'жіңішке',ы:'жуан',і:'жіңішке',е:'жіңішке',э:'жіңішке'};
const QATAÑ='пфкқтсшщхһцч', UYAN='бвгғдджз', UNDI='лмнңрй';
function expected(ch){if(VOWELS[ch])return {color:'red',label:VOWELS[ch]};return {color:'blue',label:QATAÑ.includes(ch)?'қатаң':UYAN.includes(ch)?'ұяң':'үнді'}}
let index=0,answers=WORDS.map(w=>Array.from(w,()=>({color:null,label:null}))),done=Array(WORDS.length).fill(false),selected=null,seconds=0,started=false,audio=null;
const $=id=>document.getElementById(id);function tone(ok){try{audio??=new (window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume();let now=audio.currentTime;for(let k=0;k<(ok?2:1);k++){let o=audio.createOscillator(),g=audio.createGain();o.type=ok?'sine':'sawtooth';o.frequency.setValueAtTime(ok?(660+k*220):210,now+k*.13);g.gain.setValueAtTime(.0001,now+k*.13);g.gain.exponentialRampToValueAtTime(.13,now+k*.13+.012);g.gain.exponentialRampToValueAtTime(.0001,now+k*.13+.16);o.connect(g);g.connect(audio.destination);o.start(now+k*.13);o.stop(now+k*.13+.17)}}catch(e){}}
setInterval(()=>{if(started&&!done.every(Boolean)){seconds++;$('timer').textContent=String(Math.floor(seconds/60)).padStart(2,'0')+':'+String(seconds%60).padStart(2,'0')}},1000);
function draw(){let word=WORDS[index];$('displayWord').innerHTML=[...word].map(ch=>'<span>'+ch.toLocaleUpperCase('kk-KZ')+'</span>').join('');document.documentElement.style.setProperty('--letters',word.length);$('progress').textContent=(index+1)+' / 30';$('counter').textContent='Дұрыс: '+done.filter(Boolean).length+' / 30';$('board').innerHTML='';for(let i=0;i<word.length;i++){let a=answers[index][i],c=document.createElement('div');c.className='lettercol';let shown=a.label==='жіңішке'?'<span class="label-lines">жіңіш<br>ке</span>':(a.label||'');c.innerHTML=`<div class="slot circle ${a.color||''}" data-i="${i}" data-kind="color" aria-label="${i+1}-дыбыстың түсі"></div><div class="slot label ${a.label?'filled':''} ${a.label==='жіңішке'?'long-label':''}" data-i="${i}" data-kind="label">${shown}</div>`;$('board').append(c)}$('status').textContent=done[index]?'✓ ЖАРАЙСЫҢ! ДЫБЫСТЫҚ ТАЛДАУ ДҰРЫС!':'';drawNav();$('prev').disabled=index===0;$('prev').style.opacity=index===0?'.5':'1';$('next').textContent=index===29?'СОҢЫ ▶':'КЕЛЕСІ ▶'}
function drawNav(){$('nav').innerHTML='';WORDS.forEach((w,i)=>{let b=document.createElement('button');b.textContent=i+1;b.className=(i===index?'current ':'')+(done[i]?'done':'');b.onclick=()=>go(i);$('nav').append(b)})}
function go(i){index=Math.max(0,Math.min(29,i));selected=null;document.querySelectorAll('.tile').forEach(t=>t.classList.remove('active'));draw()}
function check(){let w=WORDS[index],a=answers[index];if(a.some(x=>!x.color||!x.label))return;let ok=[...w].every((ch,i)=>{let e=expected(ch);return a[i].color===e.color&&a[i].label===e.label});if(ok){done[index]=true;$('status').textContent='✓ КЕРЕМЕТ! ДЫБЫСТЫҚ ТАЛДАУ ДҰРЫС!';$('counter').textContent='Дұрыс: '+done.filter(Boolean).length+' / 30';drawNav();if(done.every(Boolean)){$('status').textContent='🏆 ЖАРАЙСЫҢ! БАРЛЫҚ 30 СӨЗДІ ТАЛДАДЫҢ!'}}else{$('status').textContent='ҚАЙТА ОЙЛАН! ҚАТЕ ЖЕРІН ТҮЗЕТ.'}}
function place(i,kind,val){started=true;let a=answers[index][i];const expectedValue=expected(WORDS[index][i])[kind];const changed=a[kind]!==val;a[kind]=val;done[index]=false;if(changed)tone(val===expectedValue);draw();check()}
$('board').addEventListener('click',e=>{let slot=e.target.closest('.slot');if(!slot)return;let kind=slot.dataset.kind,i=Number(slot.dataset.i);if(selected&&selected.type===kind){place(i,kind,selected.val);return} // tap existing slot to clear
if(answers[index][i][kind]){answers[index][i][kind]=null;done[index]=false;draw()}});
const options=[['color','red',''],['color','blue',''],['label','жуан','ЖУАН'],['label','жіңішке','ЖІҢІШКЕ'],['label','қатаң','ҚАТАҢ'],['label','ұяң','ҰЯҢ'],['label','үнді','ҮНДІ']];
for(let [type,val,label] of options){let b=document.createElement('button');b.className='tile';b.dataset.type=type;b.dataset.val=val;b.textContent=label;b.setAttribute('aria-label',label|| (val==='red'?'Қызыл':'Көк'));$('tiles').append(b)}
let drag=null;const tiles=$('tiles');tiles.addEventListener('pointerdown',e=>{let t=e.target.closest('.tile');if(!t)return;started=true;selected={type:t.dataset.type,val:t.dataset.val};document.querySelectorAll('.tile').forEach(x=>x.classList.toggle('active',x===t));drag={id:e.pointerId,x:e.clientX,y:e.clientY,type:selected.type,val:selected.val,ghost:null};try{t.setPointerCapture(e.pointerId)}catch(_){}});
tiles.addEventListener('pointermove',e=>{if(!drag||e.pointerId!==drag.id)return;if(!drag.ghost&&Math.hypot(e.clientX-drag.x,e.clientY-drag.y)>8){drag.ghost=document.createElement('div');drag.ghost.className='ghost';drag.ghost.textContent=drag.type==='color'?(drag.val==='red'?'🔴':'🔵'):drag.val.toUpperCase();document.body.append(drag.ghost)}if(drag.ghost){drag.ghost.style.left=e.clientX+'px';drag.ghost.style.top=e.clientY+'px'}});
tiles.addEventListener('pointerup',e=>{if(!drag||e.pointerId!==drag.id)return;let slot=document.elementFromPoint(e.clientX,e.clientY)?.closest('.slot');if(slot&&slot.dataset.kind===drag.type)place(Number(slot.dataset.i),drag.type,drag.val);drag.ghost?.remove();drag=null});tiles.addEventListener('pointercancel',()=>{drag?.ghost?.remove();drag=null});
$('next').onclick=()=>{if(index<29)go(index+1);else{$('status').textContent=done.every(Boolean)?'🏆 БАРЛЫҒЫН ОРЫНДАДЫҢ!':'АЯҚТАЛМАҒАН ТАПСЫРМАЛАРҒА 1–30 НӨМІРЛЕРІ АРҚЫЛЫ ҚАЙТА ОРАЛ!'}};
$('prev').onclick=()=>go(index-1);$('restart').onclick=()=>{if(!confirm('Ойынды басынан бастаймыз ба?'))return;index=0;answers=WORDS.map(w=>Array.from(w,()=>({color:null,label:null})));done.fill(false);seconds=0;started=false;$('timer').textContent='00:00';draw()};draw();
</script></body></html>
